[project]
name = "activity-graphs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair[all]>=5.5.0",
    "contextily>=1.6.2",
    "dash>=3.0.4",
    "duckdb>=1.3.1",
    "fastexcel>=0.14.0",
    "geopandas>=1.1.0",
    "hydra-core>=1.3.2",
    "marimo[lsp]>=0.13.11",
    "matplotlib>=3.10.3",
    "mypy>=1.15.0",
    "nbformat>=5.10.4",
    "networkx>=3.4.2",
    "omegaconf>=2.3.0",
    "plotly>=6.1.2",
    "polars[pyarrow]>=1.30.0",
    "pyproj>=3.7.1",
    "ruff>=0.11.11",
    "scikit-learn>=1.7.1",
    "scipy>=1.15.3",
    "sqlglot>=26.29.0",
    "torch>=2.7.1",
    "torch-geometric>=2.6.1",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
]

[tool.marimo.runtime]
pythonpath = ["activitygraphs"]
lsp = true
output_max_bytes = 30_000_000

[tool.marimo.language_servers.pylsp]
enabled = true               # Enable/disable the Python language server
enable_mypy = true           # Type checking with mypy (enabled by default, if installed)
enable_ruff = true           # Linting with ruff (enabled by default, if installed)
enable_flake8 = false        # Linting with flake8
enable_pydocstyle = false    # Check docstring style
enable_pylint = false        # Linting with pylint
enable_pyflakes = false      # Syntax checking with pyflakes

# Diagnostics configuration
[tool.marimo.diagnostics]
enabled = true               # Show diagnostics in the editor

[tool.ruff]
line-length = 120
